[workspace]
authors = ["millennium-nova <s2111268@u.tsukuba.ac.jp>"]
channels = ["conda-forge", "pytorch"]
name = "terra-fusion"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

[tasks]
uncond-infer = "python uncond-inference.py"
sketch-infer = "python sketch-inference.py"
draw-sketch = "python draw_sketch.py"

[dependencies]
python = "3.10.*"
pytorch-gpu = "*"
cuda-version = "12.8.*"
numpy = ">=2.2.6,<3"
imageio = ">=2.37.0,<3"
diffusers = ">=0.35.2,<0.36"
accelerate = ">=1.12.0,<2"
transformers = ">=4.57.6,<5"
opencv = ">=4.12.0,<5"
torchvision = ">=0.22.0,<0.23"
pillow = ">=10.0.0,<12"
tqdm = ">=4.60.0,<5"
tifffile = ">=2023.7.0,<2025"
pyqt6 = ">=6.5.0,<7"
safetensors = ">=0.4.0,<1"

[pypi-dependencies]
pyvista = ">=0.43.0,<1"
scipy = "*"
